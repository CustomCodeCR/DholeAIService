name: Fix modality-aware EXW origin search

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-mode-aware-origin-search-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mode-aware geographic search
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.AI.Api/Endpoints/AiLogisticsEndpoints.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          replace_once(
              '        var pickupAddress = request.PickupAddress?.Trim();',
              '        var pickupAddress = request.PickupAddress?.Trim();\n        var transportMode = NormalizeTransportMode(request.TransportMode);',
              'pickup mode anchor',
          )

          discovery_start = text.index('        var discovered = new List<DiscoveredPort>();')
          discovery_end = text.index('        var candidates = discovered', discovery_start)
          discovery = '\n'.join([
              '        var discovered = new List<DiscoveredPort>();',
              '        if (transportMode is not "Air" and not "Land")',
              '        {',
              '            discovered.AddRange(await DiscoverPortsWithOverpassAsync(',
              '                overpass,',
              '                pickupLatitude,',
              '                pickupLongitude,',
              '                radiusKm,',
              '                cancellationToken',
              '            ));',
              '        }',
              '',
              '        discovered.AddRange(await DiscoverNamedPortsWithNominatimAsync(',
              '            nominatim,',
              '            pickupAddress,',
              '            pickupLocation,',
              '            pickupLatitude,',
              '            pickupLongitude,',
              '            radiusKm,',
              '            transportMode,',
              '            cancellationToken',
              '        ));',
              '',
          ])
          text = text[:discovery_start] + discovery + text[discovery_end:]

          replace_once(
              '                maxDistanceKm = radiusKm,',
              '                maxDistanceKm = radiusKm,\n                transportMode,',
              'empty response mode anchor',
          )

          replace_once(
              '        var systemPrompt = string.Join(',
              '        var transportDescription = transportMode == "Air"\n            ? "aeropuertos reales aptos para carga aérea"\n            : transportMode == "Land"\n                ? "nodos logísticos terrestres"\n                : "puertos marítimos comerciales reales";\n\n        var systemPrompt = string.Join(',
              'prompt mode anchor',
          )
          replace_once(
              '            "Eres un especialista en logística internacional y selección de puertos marítimos.",',
              '            $"Eres un especialista en logística internacional y selección de {transportDescription}.",\n            $"La modalidad seleccionada es {transportMode}. Solo recomienda infraestructura compatible con esa modalidad.",',
              'prompt role anchor',
          )
          replace_once(
              '            "Nunca inventes un puerto que no esté en la lista de candidatos.",',
              '            "Nunca inventes un punto que no esté en la lista de candidatos y no confundas nombres de ciudades, barrios o comercios con infraestructura logística real.",',
              'prompt anti-hallucination anchor',
          )
          replace_once(
              '$"Lugar de recolección: {locationText}\\nRadio máximo: {radiusKm:0} km\\nPuertos geográficos encontrados: {candidatesJson}"',
              '$"Lugar de recolección: {locationText}\\nModalidad: {transportMode}\\nRadio máximo: {radiusKm:0} km\\nCandidatos geográficos compatibles: {candidatesJson}"',
              'prompt candidates anchor',
          )

          replace_once(
              '        decimal radiusKm,\n        CancellationToken cancellationToken\n    )\n    {\n        var addressLocality = pickupAddress?',
              '        decimal radiusKm,\n        string transportMode,\n        CancellationToken cancellationToken\n    )\n    {\n        var addressLocality = pickupAddress?',
              'nominatim signature anchor',
          )
          replace_once(
              '        if (localities.Length == 0) return Array.Empty<DiscoveredPort>();',
              '        if (localities.Length == 0 || transportMode == "Land") return Array.Empty<DiscoveredPort>();',
              'land nominatim anchor',
          )

          queries_start = text.index('            var queries = new[]', text.index('DiscoverNamedPortsWithNominatimAsync'))
          queries_end = text.index('\n\n            foreach (var query in queries)', queries_start)
          queries = '\n'.join([
              '            var queries = transportMode == "Air"',
              '                ? new[]',
              '                {',
              '                    $"{locality} International Airport",',
              '                    $"{locality} Airport",',
              '                    $"Airport {locality}",',
              '                    $"Aeropuerto {locality}",',
              '                }',
              '                : new[]',
              '                {',
              '                    $"Port of {locality}",',
              '                    $"{locality} Port",',
              '                    $"{locality} Harbor",',
              '                    $"{locality} Harbour",',
              '                    $"Puerto {locality}",',
              '                };',
          ])
          text = text[:queries_start] + queries + text[queries_end:]

          replace_once(
              '                    var url = $"search?format=jsonv2&limit=5&addressdetails=1{countryFilter}&q={Uri.EscapeDataString(query)}";',
              '                    var url = $"search?format=jsonv2&limit=5&addressdetails=1&extratags=1{countryFilter}&q={Uri.EscapeDataString(query)}";',
              'nominatim extratags anchor',
          )

          foreach_anchor = '                    foreach (var row in document.RootElement.EnumerateArray())\n                    {\n'
          filter_lines = [
              '                        var category = FirstNonEmpty(ReadString(row, "category"), ReadString(row, "class"))?.ToLowerInvariant();',
              '                        var type = ReadString(row, "type")?.ToLowerInvariant();',
              '                        JsonElement extraTags = default;',
              '                        var hasExtraTags = row.TryGetProperty("extratags", out extraTags) && extraTags.ValueKind == JsonValueKind.Object;',
              '                        var industrial = hasExtraTags ? ReadString(extraTags, "industrial")?.ToLowerInvariant() : null;',
              '                        var harbour = hasExtraTags ? ReadString(extraTags, "harbour")?.ToLowerInvariant() : null;',
              '                        var seamarkType = hasExtraTags ? ReadString(extraTags, "seamark:type")?.ToLowerInvariant() : null;',
              '',
              '                        if (transportMode == "Air")',
              '                        {',
              '                            if (category != "aeroway" || (type != "aerodrome" && type != "airport")) continue;',
              '                        }',
              '                        else',
              '                        {',
              '                            var displayName = FirstNonEmpty(ReadString(row, "name"), ReadString(row, "display_name")) ?? string.Empty;',
              '                            var normalizedName = Normalize(displayName);',
              '                            var nameLooksMaritime = normalizedName.Contains("port") || normalizedName.Contains("puerto") || normalizedName.Contains("harbour") || normalizedName.Contains("harbor");',
              '                            var isMaritime = industrial == "port"',
              '                                || !string.IsNullOrWhiteSpace(harbour)',
              '                                || seamarkType == "harbour"',
              '                                || (category == "place" && type == "seaport")',
              '                                || (category == "waterway" && type == "dock")',
              '                                || (category == "landuse" && type == "industrial" && nameLooksMaritime);',
              '                            if (!isMaritime) continue;',
              '                        }',
              '',
          ]
          replace_once(foreach_anchor, foreach_anchor + '\n'.join(filter_lines), 'nominatim row filter anchor')

          replace_once(
              '                            null,\n                            country,',
              '                            hasExtraTags\n                                ? transportMode == "Air"\n                                    ? FirstNonEmpty(ReadString(extraTags, "iata"), ReadString(extraTags, "icao"), ReadString(extraTags, "ref"))\n                                    : FirstNonEmpty(ReadString(extraTags, "locode"), ReadString(extraTags, "ref"))\n                                : null,\n                            country,',
              'transport code anchor',
          )

          replace_once(
              '    private static decimal CalculateDistanceKm(',
              '    private static string NormalizeTransportMode(string? value)\n    {\n        var normalized = NormalizeOptional(value)?.ToLowerInvariant();\n        return normalized switch\n        {\n            "air" or "aereo" or "aéreo" => "Air",\n            "land" or "terrestre" => "Land",\n            "multimodal" => "Multimodal",\n            _ => "Maritime",\n        };\n    }\n\n    private static decimal CalculateDistanceKm(',
              'normalize transport helper anchor',
          )

          replace_once(
              '        decimal? MaxDistanceKm = MaximumAllowedRadiusKm\n    );',
              '        decimal? MaxDistanceKm = MaximumAllowedRadiusKm,\n        string? TransportMode = "Maritime"\n    );',
              'request transport mode anchor',
          )

          path.write_text(text, encoding='utf-8')
          print('Mode-aware EXW geographic search patched.')
          PY
      - name: Commit patch and clean temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-mode-aware-origin-search-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): enforce transport-specific EXW origins'
          git push origin HEAD:master
