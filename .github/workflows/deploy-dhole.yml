name: Deploy Dhole AI
# International cargo port filtering release — 2026-08-27

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: dhole-ai-deploy
  cancel-in-progress: false

env:
  COMPOSE_FILE: /opt/dhole/docker-compose.services.yml

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]

    steps:
      - name: Checkout service
        uses: actions/checkout@v4

      - name: Verify server
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version
          docker network inspect dhole >/dev/null
          test -r /opt/dhole/.env
          test -r "$COMPOSE_FILE"
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" config -q

      - name: Build images
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Api/Dockerfile -t dhole/ai-api:latest -t "dhole/ai-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Workers/Dockerfile -t dhole/ai-workers:latest -t "dhole/ai-workers:$SHA_TAG" .

      - name: Deploy AI
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" up -d --no-deps --force-recreate --pull never ai-api ai-workers
          docker compose --env-file /opt/dhole/.env -f "$COMPOSE_FILE" ps ai-api ai-workers

      - name: Cleanup old images
        run: docker image prune -f
