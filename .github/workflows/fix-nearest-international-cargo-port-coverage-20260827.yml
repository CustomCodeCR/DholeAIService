name: Fix nearest international cargo port coverage

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-nearest-international-cargo-port-coverage-20260827.yml'
      - '.github/scripts/fix_nearest_cargo_port_coverage.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix_nearest_cargo_port_coverage.py
      - name: Commit patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-nearest-international-cargo-port-coverage-20260827.yml
          rm -f .github/scripts/fix_nearest_cargo_port_coverage.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): discover all nearby international cargo ports by radius'
          git push origin HEAD:master
