name: Fix international cargo ports for EXW

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-international-cargo-ports-20260827.yml'
      - '.github/scripts/fix_international_cargo_ports.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/fix_international_cargo_ports.py
      - name: Commit patch
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-international-cargo-ports-20260827.yml
          rm -f .github/scripts/fix_international_cargo_ports.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): restrict EXW maritime search to cargo ports'
          git push origin HEAD:master
