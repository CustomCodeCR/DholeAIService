name: Apply Semantic Pricing Extraction Architecture

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/apply-raw-pricing-extraction.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply architecture changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_raw_pricing_extraction.py
          git diff --check
          git diff -- src/Dhole.AI.Workers/Workers/AiEmailAnalysisWorker.cs src/Dhole.AI.Workers/EmailAnalysis/PricingEmailAiExecutionFactory.cs src/Dhole.AI.Persistence/Initialization/AiDefaultProfilesInitializer.cs

      - name: Commit architecture change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dhole.AI.Workers/Workers/AiEmailAnalysisWorker.cs src/Dhole.AI.Workers/EmailAnalysis/PricingEmailAiExecutionFactory.cs src/Dhole.AI.Persistence/Initialization/AiDefaultProfilesInitializer.cs
          git diff --cached --quiet && exit 0
          git commit -m "refactor(ai): extract pricing facts before normalization"
          git push origin HEAD:master
