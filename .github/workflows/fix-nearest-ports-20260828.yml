name: Repair nearest maritime port discovery

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-nearest-ports-20260828.yml'

permissions:
  contents: write
  packages: read

jobs:
  repair:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout AI service
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch geographic maritime port discovery
        shell: bash
        run: python3 .github/scripts/fix-nearest-ports-20260828.py

      - name: Validate AI API image
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Api/Dockerfile -t dhole/ai-api:nearest-port-fix-validation .

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-nearest-ports-20260828.yml
          rm -f .github/scripts/fix-nearest-ports-20260828.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): make nearest maritime port lookup geographic and resilient'
          git push origin HEAD:master
