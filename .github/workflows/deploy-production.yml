name: Deploy Dhole AI - Production

on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: dhole-ai-production
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system; then
              break
            fi
            rm -rf .dhole-system
            if (( attempt == 5 )); then
              echo '::error::DholeSystem checkout unavailable after 5 attempts; inspect runner DNS and HTTPS.'
              getent ahostsv4 github.com || true
              exit 1
            fi
            echo "::warning::Transient checkout failure, retry $attempt/5"
            sleep $((attempt * 5))
          done
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.production" >> "$GITHUB_ENV"
      - name: Capture AI runtime state before restart
        run: |
          set +e
          echo "=== AI service status ==="
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps ai-api ai-workers
          echo "=== AI worker recent logs ==="
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" logs --no-color --tail=250 ai-workers
          echo "=== Container resources ==="
          docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}' | grep -E 'NAME|ai|ollama'
          OLLAMA_CONTAINER="$(docker ps --format '{{.Names}}' | grep -Ei 'ollama' | head -n 1)"
          if [ -n "$OLLAMA_CONTAINER" ]; then
            echo "=== Ollama loaded models ==="
            docker exec "$OLLAMA_CONTAINER" ollama ps
            echo "=== Ollama installed models ==="
            docker exec "$OLLAMA_CONTAINER" ollama list
          else
            echo "No running Ollama container found by name."
          fi
          set -e
      - name: Verify production server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" config -q
      - name: Run pricing prompt integrity regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e NUGET_PACKAGES=/tmp/nuget \
            -e NuGetPackageSourceCredentials_github \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc 'dotnet restore tests/Dhole.AI.UnitTests/Dhole.AI.UnitTests.csproj --configfile NuGet.Config && dotnet test tests/Dhole.AI.UnitTests/Dhole.AI.UnitTests.csproj -c Release --no-restore --filter "FullyQualifiedName~PricingPromptIntegrityGuardTests|FullyQualifiedName~PricingImageExtractionTests"'
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Api/Dockerfile -t dhole/ai-api:latest -t "dhole/ai-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Workers/Dockerfile -t dhole/ai-workers:latest -t "dhole/ai-workers:$SHA_TAG" .
      - name: Deploy AI
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never ai-api ai-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -p "$COMPOSE_PROJECT" ps ai-api ai-workers
      - name: Cleanup old images
        if: always()
        continue-on-error: true
        run: docker image prune -f