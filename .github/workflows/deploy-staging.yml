name: Deploy Dhole AI - Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: dhole-ai-staging
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  COMPOSE_OVERRIDE: .dhole-system/deploy/docker-compose.staging.yml
  DHOLE_IMAGE_TAG: staging
  DHOLE_NETWORK: dhole-staging
  COMPOSE_PROJECT: dhole-staging
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system
          mkdir -p "$RUNNER_TEMP/dhole-env"
          bash .dhole-system/deploy/prepare-environments.sh /opt/dhole/.env "$RUNNER_TEMP/dhole-env"
          echo "DHOLE_ENV_FILE=$RUNNER_TEMP/dhole-env/.env.staging" >> "$GITHUB_ENV"
      - name: Verify staging server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" config -q
      - name: Run pricing prompt integrity regressions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export NuGetPackageSourceCredentials_github="Username=${GITHUB_ACTOR};Password=${GITHUB_TOKEN};ValidAuthenticationTypes=Basic"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -e DOTNET_CLI_HOME=/tmp \
            -e NUGET_PACKAGES=/tmp/nuget \
            -e NuGetPackageSourceCredentials_github \
            -v "$PWD:/src" \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            bash -lc 'dotnet restore tests/Dhole.AI.UnitTests/Dhole.AI.UnitTests.csproj --configfile NuGet.Config && dotnet test tests/Dhole.AI.UnitTests/Dhole.AI.UnitTests.csproj -c Release --no-restore --filter "FullyQualifiedName~PricingPromptIntegrityGuardTests"'
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Api/Dockerfile -t dhole/ai-api:staging -t "dhole/ai-api:staging-$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Workers/Dockerfile -t dhole/ai-workers:staging -t "dhole/ai-workers:staging-$SHA_TAG" .
      - name: Deploy AI staging
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never ai-api ai-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$COMPOSE_OVERRIDE" -p "$COMPOSE_PROJECT" ps ai-api ai-workers
      - name: Cleanup old images
        run: docker image prune -f
