name: Fix international cargo ports for EXW

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-international-cargo-ports-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict maritime EXW search to international cargo ports
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.AI.Api/Endpoints/AiLogisticsEndpoints.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          replace_once(
              '                : "puertos marítimos comerciales reales";',
              '                : "puertos marítimos comerciales de carga internacional";',
              'transport description',
          )

          replace_once(
              '            "Nunca inventes un punto que no esté en la lista de candidatos y no confundas nombres de ciudades, barrios o comercios con infraestructura logística real.",',
              '            "Nunca inventes un punto que no esté en la lista de candidatos y no confundas nombres de ciudades, barrios o comercios con infraestructura logística real.",\n            transportMode is "Maritime" or "Multimodal"\n                ? "Para marítimo solo son válidos puertos comerciales que realmente manejen carga internacional: contenedores, carga general, graneles, RoRo de carga o terminales tanker. Excluye marinas, pesca, ferris o terminales solo de pasajeros, cruceros, muelles locales, astilleros, bases navales y puertos sin operación internacional de carga."\n                : "Mantén estrictamente la infraestructura compatible con la modalidad seleccionada.",\n            transportMode is "Maritime" or "Multimodal"\n                ? "Si no puedes justificar que un candidato sirve para transporte marítimo internacional de carga, NO lo recomiendes."\n                : "No recomiendes infraestructura de otra modalidad.",',
              'prompt cargo restriction',
          )

          old_query = '            var query = $"[out:json][timeout:25];(nwr(around:{radiusMeters},{lat},{lon})[\\"industrial\\"=\\"port\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"harbour\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"seamark:type\\"=\\"harbour\\"];);out center tags;";'
          new_query = '            var query = $"[out:json][timeout:25];(nwr(around:{radiusMeters},{lat},{lon})[\\"industrial\\"=\\"port\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"port\\"=\\"cargo\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"cargo\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"seamark:harbour:category\\"~\\"cargo|container|bulk|tanker|roro\\",i];nwr(around:{radiusMeters},{lat},{lon})[\\"harbour:category\\"~\\"general|cargo|container|bulk|tanker|industrial|roro\\",i];);out center tags;";'
          replace_once(old_query, new_query, 'Overpass cargo query')

          replace_once(
              '                if (string.IsNullOrWhiteSpace(name)) continue;\n\n                ports.Add(new DiscoveredPort(',
              '                if (string.IsNullOrWhiteSpace(name)) continue;\n                if (!IsInternationalCargoPort(tags, name)) continue;\n\n                ports.Add(new DiscoveredPort(',
              'Overpass cargo validation',
          )

          replace_once(
              '                    FirstNonEmpty(ReadString(tags, "locode"), ReadString(tags, "ref")),',
              '                    FirstNonEmpty(ReadString(tags, "locode"), ReadString(tags, "seamark:harbour:locode"), ReadString(tags, "ref")),',
              'Overpass locode',
          )

          old_queries = '''                : new[]
                {
                    $"Port of {locality}",
                    $"{locality} Port",
                    $"{locality} Harbor",
                    $"{locality} Harbour",
                    $"Puerto {locality}",
                };'''
          new_queries = '''                : new[]
                {
                    $"{locality} cargo port",
                    $"{locality} container terminal",
                    $"{locality} commercial seaport",
                    $"Port of {locality} cargo",
                    $"Puerto de carga {locality}",
                };'''
          replace_once(old_queries, new_queries, 'Nominatim cargo queries')

          old_filter = '''                        else
                        {
                            var displayName = FirstNonEmpty(ReadString(row, "name"), ReadString(row, "display_name")) ?? string.Empty;
                            var normalizedName = Normalize(displayName);
                            var nameLooksMaritime = normalizedName.Contains("port") || normalizedName.Contains("puerto") || normalizedName.Contains("harbour") || normalizedName.Contains("harbor");
                            var isMaritime = industrial == "port"
                                || !string.IsNullOrWhiteSpace(harbour)
                                || seamarkType == "harbour"
                                || (category == "place" && type == "seaport")
                                || (category == "waterway" && type == "dock")
                                || (category == "landuse" && type == "industrial" && nameLooksMaritime);
                            if (!isMaritime) continue;
                        }'''
          new_filter = '''                        else
                        {
                            var displayName = FirstNonEmpty(ReadString(row, "name"), ReadString(row, "display_name")) ?? string.Empty;
                            if (!hasExtraTags || !IsInternationalCargoPort(extraTags, displayName, category, type)) continue;
                        }'''
          replace_once(old_filter, new_filter, 'Nominatim cargo filter')

          replace_once(
              '                                    : FirstNonEmpty(ReadString(extraTags, "locode"), ReadString(extraTags, "ref"))',
              '                                    : FirstNonEmpty(ReadString(extraTags, "locode"), ReadString(extraTags, "seamark:harbour:locode"), ReadString(extraTags, "ref"))',
              'Nominatim locode',
          )

          marker = '    private static bool TryReadCoordinates(\n'
          if marker not in text:
              raise SystemExit('helper insertion marker not found')

          helper = r'''    private static bool IsInternationalCargoPort(
        JsonElement tags,
        string name,
        string? category = null,
        string? type = null
    )
    {
        var industrial = ReadString(tags, "industrial")?.ToLowerInvariant();
        var port = ReadString(tags, "port")?.ToLowerInvariant();
        var portType = ReadString(tags, "port:type")?.ToLowerInvariant();
        var cargo = ReadString(tags, "cargo")?.ToLowerInvariant();
        var seamarkCategory = ReadString(tags, "seamark:harbour:category")?.ToLowerInvariant();
        var harbourCategory = ReadString(tags, "harbour:category")?.ToLowerInvariant();
        var harbour = ReadString(tags, "harbour")?.ToLowerInvariant();
        var seamarkType = ReadString(tags, "seamark:type")?.ToLowerInvariant();
        var locode = FirstNonEmpty(
            ReadString(tags, "locode"),
            ReadString(tags, "seamark:harbour:locode")
        );
        var leisure = ReadString(tags, "leisure")?.ToLowerInvariant();
        var military = ReadString(tags, "military")?.ToLowerInvariant();
        var normalizedName = Normalize(name);

        static bool ContainsAny(string? value, params string[] tokens)
        {
            if (string.IsNullOrWhiteSpace(value)) return false;
            return tokens.Any(token => value.Contains(token, StringComparison.OrdinalIgnoreCase));
        }

        var hasCargoSubtag = false;
        if (tags.ValueKind == JsonValueKind.Object)
        {
            foreach (var property in tags.EnumerateObject())
            {
                if (!property.Name.StartsWith("cargo:", StringComparison.OrdinalIgnoreCase)) continue;
                var value = property.Value.ValueKind == JsonValueKind.String
                    ? property.Value.GetString()
                    : null;
                if (!string.Equals(value, "no", StringComparison.OrdinalIgnoreCase)
                    && !string.Equals(value, "false", StringComparison.OrdinalIgnoreCase))
                {
                    hasCargoSubtag = true;
                    break;
                }
            }
        }

        var explicitCargo = port == "cargo"
            || (!string.IsNullOrWhiteSpace(cargo)
                && cargo is not "no" and not "passenger")
            || hasCargoSubtag
            || ContainsAny(seamarkCategory, "cargo", "container", "bulk", "tanker", "roro")
            || ContainsAny(harbourCategory, "general", "cargo", "container", "bulk", "tanker", "industrial", "roro");

        var clearlyNonCargo = leisure == "marina"
            || !string.IsNullOrWhiteSpace(military)
            || ContainsAny(port, "fishing", "passenger", "marina", "seaplane")
            || (!explicitCargo && ContainsAny(seamarkCategory, "fishing", "marina", "naval", "passenger", "shipyard", "ferry", "port_support"))
            || (!explicitCargo && ContainsAny(harbourCategory, "fishing", "marina", "military", "passenger", "shipyard", "ferry", "tourism", "yacht"))
            || (!explicitCargo && ContainsAny(normalizedName, "marina", "yacht", "fishing", "ferry terminal", "cruise terminal", "naval base", "shipyard"));

        if (clearlyNonCargo) return false;
        if (explicitCargo) return true;

        var commercialSeaport = industrial == "port"
            && (portType is "seaport" or "deep_water"
                || !string.IsNullOrWhiteSpace(locode)
                || harbour == "yes"
                || seamarkType == "harbour"
                || category == "place" && type == "seaport"
                || ContainsAny(normalizedName, "container terminal", "cargo terminal", "commercial port", "commercial seaport", "puerto comercial", "puerto de carga"));

        // industrial=port representa tráfico portuario comercial en OSM. Se acepta como
        // fallback solo cuando no existen señales explícitas de marina, pesca o pasajeros.
        return commercialSeaport || industrial == "port";
    }

'''
          text = text.replace(marker, helper + marker, 1)

          path.write_text(text, encoding='utf-8')
          print('International cargo port filter applied.')
          PY

      - name: Commit code and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-international-cargo-ports-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): restrict EXW maritime search to cargo ports'
          git push origin HEAD:master
