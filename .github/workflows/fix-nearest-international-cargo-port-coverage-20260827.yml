name: Fix nearest international cargo port coverage

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-nearest-international-cargo-port-coverage-20260827.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch radius-based cargo port discovery
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/Dhole.AI.Api/Endpoints/AiLogisticsEndpoints.cs')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'{label} not found')
              text = text.replace(old, new, 1)

          replace_once(
              '            var query = $"[out:json][timeout:25];(nwr(around:{radiusMeters},{lat},{lon})[\\"industrial\\"=\\"port\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"port\\"=\\"cargo\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"cargo\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"seamark:harbour:category\\"~\\"cargo|container|bulk|tanker|roro\\",i];nwr(around:{radiusMeters},{lat},{lon})[\\"harbour:category\\"~\\"general|cargo|container|bulk|tanker|industrial|roro\\",i];);out center tags;";',
              '            var query = $"[out:json][timeout:25];(nwr(around:{radiusMeters},{lat},{lon})[\\"industrial\\"=\\"port\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"port\\"=\\"cargo\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"cargo\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"harbour\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"seamark:type\\"=\\"harbour\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"place\\"=\\"seaport\\"];nwr(around:{radiusMeters},{lat},{lon})[\\"seamark:harbour:category\\"~\\"cargo|container|bulk|tanker|roro\\",i];nwr(around:{radiusMeters},{lat},{lon})[\\"harbour:category\\"~\\"general|cargo|container|bulk|tanker|industrial|roro\\",i];);out center tags;";',
              'broaden overpass candidates',
          )

          replace_once(
              '        var localities = new[] { location.Locality, addressLocality }\n            .Where(value => !string.IsNullOrWhiteSpace(value))\n            .Select(value => value!.Trim())\n            .Distinct(StringComparer.OrdinalIgnoreCase)\n            .Take(2)\n            .ToArray();',
              '        var localities = new[] { location.Locality, addressLocality, location.Region, location.Country }\n            .Where(value => !string.IsNullOrWhiteSpace(value))\n            .Select(value => value!.Trim())\n            .Distinct(StringComparer.OrdinalIgnoreCase)\n            .Take(4)\n            .ToArray();',
              'include region and country fallback searches',
          )

          replace_once(
              '                            if (!hasExtraTags || !IsInternationalCargoPort(extraTags, displayName, category, type)) continue;',
              '                            var explicitSeaport = category == "place" && type == "seaport";\n                            if (hasExtraTags)\n                            {\n                                if (!IsInternationalCargoPort(extraTags, displayName, category, type)) continue;\n                            }\n                            else if (!explicitSeaport)\n                            {\n                                continue;\n                            }',
              'allow typed seaports without extratags',
          )

          old_tail = '''        var commercialSeaport = industrial == "port"
            && (portType is "seaport" or "deep_water"
                || !string.IsNullOrWhiteSpace(locode)
                || harbour == "yes"
                || seamarkType == "harbour"
                || category == "place" && type == "seaport"
                || ContainsAny(normalizedName, "container terminal", "cargo terminal", "commercial port", "commercial seaport", "puerto comercial", "puerto de carga"));

        return commercialSeaport || industrial == "port";'''
          new_tail = '''        var maritimeInfrastructure = industrial == "port"
            || harbour == "yes"
            || seamarkType == "harbour"
            || portType is "seaport" or "deep_water"
            || category == "place" && type == "seaport"
            || type == "seaport"
            || ContainsAny(normalizedName, "container terminal", "cargo terminal", "commercial port", "commercial seaport", "puerto comercial", "puerto de carga");

        if (!maritimeInfrastructure) return false;

        // Candidate discovery must be broad enough to include real ports such as Caldera/Moín
        // even when OSM does not carry complete cargo subtags. The AI performs the final
        // international-cargo validation; this stage only rejects obvious non-port results.
        return true;'''
          replace_once(old_tail, new_tail, 'relax candidate prefilter without admitting businesses')

          replace_once(
              '            "Devuelve hasta 5 opciones, ordenadas de mejor a peor. Conserva exactamente nombre, código, latitud, longitud y distancia del candidato elegido.",',
              '            "Devuelve TODAS las opciones válidas de carga internacional que estén en los candidatos, hasta un máximo de 5. No omitas un puerto válido solo por preferir otro. Ordénalas estrictamente por distanceKm de menor a mayor. Conserva exactamente nombre, código, latitud, longitud y distancia del candidato elegido.",',
              'force complete nearest ordering',
          )

          path.write_text(text, encoding='utf-8')
          print('Nearest cargo port coverage patch applied.')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-nearest-international-cargo-port-coverage-20260827.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): discover all nearby international cargo ports by radius'
          git push origin HEAD:master
