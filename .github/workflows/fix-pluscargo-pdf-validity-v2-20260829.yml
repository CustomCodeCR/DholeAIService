name: Apply PlusCargo PDF validity and agent v2

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/fix-pluscargo-pdf-validity-v2-20260829.yml'

permissions:
  contents: write
  packages: read

jobs:
  patch:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse and apply AI patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/fix-pluscargo-pdf-validity-20260829.yml').read_text()
          start = source.index('      - name: Patch AI PDF normalization')
          end = source.index('      - name: Validate focused tests', start)
          block = source[start:end]
          marker = '        run: |\n'
          script = block.split(marker, 1)[1]
          lines = [line[10:] if line.startswith('          ') else line for line in script.splitlines()]
          Path('/tmp/apply-pluscargo-ai.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-pluscargo-ai.sh
          git diff --check

      - name: Validate production compile
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="dhole/ai-pluscargo-check:${GITHUB_RUN_ID}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.AI.Workers/Dockerfile -t "$TAG" .
          docker image rm -f "$TAG" >/dev/null 2>&1 || true

      - name: Commit directly to master
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-pluscargo-pdf-validity-20260829.yml
          rm -f .github/workflows/fix-pluscargo-pdf-validity-v2-20260829.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): recover PlusCargo PDF validity and agent"
          git pull --rebase origin master
          git push origin HEAD:master
